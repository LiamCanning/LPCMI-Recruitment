<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LPCMI Recruitment</title>
<meta name="description" content="Club staff, requirements and squad depth in one place.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="app.css">
<script>
  // Set the theme before first paint so a dark-mode user never sees a flash of paper.
  try {
    var t = localStorage.getItem('lp-theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
</head>
<body>
  <div class="shell" data-rail=""></div>
  <script src="app.js"></script>
</body>
</html>
