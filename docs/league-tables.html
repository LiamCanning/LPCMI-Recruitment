<head>

<style>
/* ═══════════════════════════════════════════════════════════════════════
   LPCMI Football Tracker — Design Tokens
   ───────────────────────────────────────────────────────────────────────
   Single source of truth for colour, typography, spacing, radius and
   shadow values. Loaded FIRST on every page by build_spreadsheet.py.

   Token naming convention: --lp-<role>-<variant>
     • Surface  (background layers)
     • Ink      (text)
     • Border   (lines, dividers)
     • Accent   (interactive primary colour)
     • Brand    (LPCMI navy — kept for sidebar/branded surfaces)
     • Status   (semantic context: success / warn / info / danger)
     • Outreach (status pill colours — Pass 2 will consolidate component)
     • Font / Radius / Shadow / Layout / Motion

   The bottom of this file contains a COMPATIBILITY SHIM that aliases
   every legacy variable name (--primary, --accent, --bg, --text, etc.
   and --lp-bg, --lp-card, --lp-ink, etc.) to its canonical token.
   This shim is removed in Pass 5 once all references are updated.

   This file MUST not change visual output on its own — it preserves
   every existing colour value. Visual passes (1-5) evolve the tokens.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* ── Surface: background layers ──────────────────────────────────── */
  --lp-surface-app:     #f6f8fb;   /* outer body background */
  --lp-surface-canvas:  #f8fafc;   /* page content background */
  --lp-surface-raised:  #ffffff;   /* cards, modals, dropdowns */
  --lp-surface-sunken:  #f1f5f9;   /* table headers, hover bg */

  /* ── Ink: text ───────────────────────────────────────────────────── */
  --lp-ink-strong:      #0f172a;   /* strongest body ink */
  --lp-ink-primary:     #1e293b;   /* default body text */
  --lp-ink-muted:       #64748b;   /* secondary / muted text */
  --lp-ink-disabled:    #94a3b8;   /* disabled, placeholder */
  --lp-ink-inverse:     #ffffff;   /* text on dark surfaces */

  /* ── Border ──────────────────────────────────────────────────────── */
  --lp-border-subtle:   #e2e8f0;   /* default 1px hairlines */
  --lp-border-soft:     #f1f5f9;   /* very subtle dividers */
  --lp-border-strong:   #cbd5e1;   /* hover-state borders */
  --lp-border-focus:    #3b82f6;   /* focus ring colour */

  /* ── Accent: interactive primary ─────────────────────────────────── */
  --lp-accent:          #3b82f6;
  --lp-accent-hover:    #2563eb;
  --lp-accent-ink:      #1d4ed8;   /* deeper accent for ink-on-light */
  --lp-accent-bg:       #eff6ff;   /* tinted bg for accent surfaces */
  --lp-accent-soft:     rgba(59,130,246,0.10);

  /* ── Brand: LPCMI navy (sidebar header, branded surfaces) ────────── */
  --lp-brand-primary:   #1c1e25;
  --lp-brand-primary-2: #282b34;
  --lp-brand-primary-3: #3a3f4c;
  --lp-brand-primary-grad: linear-gradient(140deg, #14161c 0%, #1c1e25 55%, #282b34 100%);
  --lp-brand-soft:      rgba(28,30,37,0.08);

  /* ── Status: semantic context colours ────────────────────────────── */
  --lp-status-success:     #16a34a;
  --lp-status-success-bg:  #dcfce7;
  --lp-status-success-ink: #166534;
  --lp-status-success-bd:  #86efac;

  --lp-status-warn:        #ca8a04;
  --lp-status-warn-bg:     #fef9c3;
  --lp-status-warn-ink:    #854d0e;
  --lp-status-warn-bd:     #fde68a;

  --lp-status-info:        #2563eb;
  --lp-status-info-bg:     #dbeafe;
  --lp-status-info-ink:    #1e40af;

  --lp-status-danger:      #dc2626;
  --lp-status-danger-bg:   #fef2f2;
  --lp-status-danger-ink:  #991b1b;

  /* ── Outreach: status pill palette
        (Pass 2 will introduce a unified .pill component reading
         from these tokens; for Pass 0 they centralise the values
         currently hard-coded in outreach-log.css.) ────────────────── */
  --lp-outreach-queued-bg:     #e2e8f0;
  --lp-outreach-queued-fg:     #475569;
  --lp-outreach-contacted-bg:  #f1f5f9;
  --lp-outreach-contacted-fg:  #475569;
  --lp-outreach-in-talks-bg:   #dcfce7;
  --lp-outreach-in-talks-fg:   #16a34a;
  --lp-outreach-offered-bg:    #bbf7d0;
  --lp-outreach-offered-fg:    #14532d;
  --lp-outreach-rejected-bg:   #fee2e2;
  --lp-outreach-rejected-fg:   #991b1b;

  /* ── Typography ─────────────────────────────────────────────────── */
  /* Unified system-font stack — renders as SF Pro on Mac, Segoe on Windows.
     No web font load needed for a local HTML tool. */
  --lp-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;

  /* Type scale — bumped one step to match Summer 2026 v2 aesthetic */
  --lp-text-2xs:  12px;   /* micro labels, badges */
  --lp-text-xs:   13px;   /* secondary labels, table meta */
  --lp-text-sm:   14px;   /* primary UI text, table cells */
  --lp-text-base: 15px;   /* body, controls, inputs */
  --lp-text-md:   17px;   /* large controls, icon buttons */
  --lp-text-lg:   21px;   /* card / section headings */
  --lp-text-xl:   28px;   /* page titles */

  /* Weights — standard values (400/500/700) for clean rendering */
  --lp-weight-regular:  400;
  --lp-weight-medium:   500;
  --lp-weight-semibold: 700;

  /* Line-heights */
  --lp-leading-tight:   1.2;
  --lp-leading-base:    1.45;
  --lp-leading-relaxed: 1.6;

  /* ── Radius (3 levels) ──────────────────────────────────────────── */
  --lp-radius-ctrl:    8px;    /* controls, inputs, buttons, chips */
  --lp-radius-surface: 12px;   /* cards, modals, panels */
  --lp-radius-pill:    999px;  /* pills, tags, avatars */

  /* ── Shadow (Pass 0: existing values — Pass 4 unifies elevation) ── */
  --lp-shadow-xs:  0 1px 2px rgba(15,23,42,0.04);
  --lp-shadow-sm:  0 2px 6px rgba(15,23,42,0.05);
  --lp-shadow:     0 8px 24px rgba(15,23,42,0.06);
  --lp-shadow-lg:  0 20px 48px rgba(15,23,42,0.10);

  --lp-shadow-flat:       0 1px 2px rgba(0,0,0,0.04),
                          0 4px 16px rgba(15,30,60,0.07),
                          inset 0 1px 0 rgba(255,255,255,0.9);
  --lp-shadow-lift:       0 8px 32px rgba(15,30,60,0.13),
                          inset 0 1px 0 rgba(255,255,255,0.9);
  --lp-shadow-btn:        0 1px 2px rgba(15,30,60,0.06),
                          inset 0 1px 0 rgba(255,255,255,0.8);
  --lp-shadow-btn-active: 0 1px 4px rgba(15,30,60,0.18),
                          inset 0 1px 0 rgba(255,255,255,0.3);

  /* ── Spacing scale (4/8 grid) ───────────────────────────────────── */
  --lp-space-1:  4px;
  --lp-space-2:  8px;
  --lp-space-3:  12px;
  --lp-space-4:  16px;
  --lp-space-6:  24px;
  --lp-space-8:  32px;
  --lp-space-12: 48px;
  --lp-space-16: 64px;

  /* ── Layout ──────────────────────────────────────────────────────── */
  --lp-sidebar-w:    250px;
  --lp-page-pad:     24px;   /* horizontal page padding */

  /* ── Motion (Pass 4 will adopt these for transitions) ────────────── */
  --lp-ease:     cubic-bezier(0.22, 1, 0.36, 1);
  --lp-duration: 120ms;
}

/* ═══════════════════════════════════════════════════════════════════════
   COMPATIBILITY SHIM — legacy aliases
   ───────────────────────────────────────────────────────────────────────
   Maps every variable name currently in use across the templates to its
   canonical token above. This shim exists so Pass 0 can strip duplicate
   :root blocks from each template without touching any var(--legacy)
   reference. Removed in Pass 5 once references are migrated.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* shared-sidebar.css (--lp-* legacy names that don't match new scheme) */
  --lp-font:         var(--lp-font-sans);
  --lp-ink:          var(--lp-ink-strong);
  --lp-ink-2:        var(--lp-ink-primary);
  --lp-muted:        var(--lp-ink-muted);
  --lp-muted-2:      var(--lp-ink-disabled);
  --lp-border:       var(--lp-border-subtle);
  /* --lp-border-soft kept identical — already canonical */
  --lp-bg:           var(--lp-surface-app);
  --lp-card:         var(--lp-surface-raised);
  --lp-primary:      var(--lp-brand-primary);
  --lp-primary-grad: var(--lp-brand-primary-grad);
  --lp-radius:       var(--lp-radius-surface);  /* 10px */
  --lp-radius-sm:    var(--lp-radius-ctrl);     /* 6px */
  /* --lp-shadow-* keep their canonical values above */

  /* master-db.css / position-page.css / summer2026.css unprefixed */
  --primary:         var(--lp-brand-primary);
  --primary-light:   var(--lp-brand-primary-2);
  --primary-mid:     var(--lp-brand-primary-3);
  --accent:          var(--lp-accent);
  --bg:              var(--lp-surface-canvas);
  --card:            var(--lp-surface-raised);
  --text:            var(--lp-ink-primary);
  --text-muted:      var(--lp-ink-muted);
  --muted:           var(--lp-ink-muted);
  --border:          var(--lp-border-subtle);
  --radius:          var(--lp-radius-surface);  /* 10px */
  --shadow:          var(--lp-shadow);
  --shadow-sm:       var(--lp-shadow-sm);
  --shadow-lg:       var(--lp-shadow-lg);

  --green:           var(--lp-status-success);
  --green-bg:        var(--lp-status-success-bg);
  --green-dark:      var(--lp-status-success-ink);
  --green-border:    var(--lp-status-success-bd);

  --yellow:          var(--lp-status-warn);
  --yellow-bg:       var(--lp-status-warn-bg);
  --yellow-dark:     var(--lp-status-warn-ink);
  --yellow-border:   var(--lp-status-warn-bd);

  --blue:            var(--lp-status-info);
  --blue-bg:         var(--lp-status-info-bg);
  --blue-dark:       var(--lp-status-info-ink);

  --red:             var(--lp-status-danger);
  --red-bg:          var(--lp-status-danger-bg);

  /* keeps-polish.css */
  --shadow-flat:        var(--lp-shadow-flat);
  --shadow-lift:        var(--lp-shadow-lift);
  --shadow-btn:         var(--lp-shadow-btn);
  --shadow-btn-active:  var(--lp-shadow-btn-active);
  --accent-soft:        var(--lp-accent-soft);
  --primary-soft:       var(--lp-brand-soft);
}

/* ── LPCMI Shared Sidebar + Shell ─────────────────────────────────────────
   Pass 2 overhaul: flat surfaces, no glass, no gradients, unified active
   signal (accent-blue everywhere), DM Sans font.
   All --lp-* tokens live in design-tokens.css.
   ─────────────────────────────────────────────────────────────────────── */

/* ── Global base ──────────────────────────────────────────────────── */
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; padding:0;
  font-family: var(--lp-font);
  background: var(--lp-bg);
  color: var(--lp-ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  line-height: var(--lp-leading-base);
  font-size: var(--lp-text-base);
  overflow: hidden;
  height: 100vh;
}

/* Clean flat app shell — no mesh gradient */
.app-layout {
  display: flex;
  height: 100vh;
  overflow: hidden;
  background: var(--lp-surface-canvas);
}

/* ── Sidebar — flat raised surface ───────────────────────────────── */
.sidebar {
  width: var(--lp-sidebar-w); flex-shrink: 0;
  position: fixed; top: 0; left: 0; bottom: 0;
  background: var(--lp-surface-raised);
  border-right: 1px solid var(--lp-border-subtle);
  display: flex; flex-direction: column;
  z-index: 200;
  overflow: hidden;
  transition: transform .25s cubic-bezier(0.22,1,0.36,1);
}

/* Sidebar header — light surface, brand shown via dot + dark text */
.sidebar-header {
  padding: 20px 20px 16px;
  flex-shrink: 0;
  background: var(--lp-surface-raised);
  border-bottom: 1px solid var(--lp-border-subtle);
  position: relative;
}
.sidebar-brand {
  font-size: var(--lp-text-base);
  font-weight: var(--lp-weight-semibold);
  color: var(--lp-ink-strong);
  letter-spacing: 0.1px;
  display: flex; align-items: center; gap: 8px;
}
.sidebar-brand::before {
  content: "";
  width: 7px; height: 7px; border-radius: 50%;
  background: #16a34a;
  box-shadow: 0 0 0 3px rgba(22,163,74,0.14);
  flex-shrink: 0;
}
.sidebar-tagline {
  font-size: var(--lp-text-2xs);
  color: var(--lp-ink-muted);
  font-weight: var(--lp-weight-regular);
  margin-top: 3px;
  letter-spacing: 0.2px;
}

/* Collapse button inside the sidebar header — desktop only */
.sidebar-collapse-btn {
  position: absolute;
  top: 16px; right: 12px;
  width: 24px; height: 24px;
  border-radius: 6px;
  background: var(--lp-surface-sunken);
  color: var(--lp-ink-muted);
  border: 1px solid var(--lp-border-subtle);
  font-size: var(--lp-text-2xs);
  font-weight: var(--lp-weight-semibold);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 3;
  transition: background .15s, color .15s, border-color .15s;
}
.sidebar-collapse-btn:hover {
  background: var(--lp-accent-bg);
  color: var(--lp-accent-ink);
  border-color: var(--lp-accent);
}

/* Floating expand-button when sidebar is collapsed (desktop only) */
.sidebar-expand-btn {
  display: none;
  position: fixed;
  top: 18px; left: 10px;
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--lp-surface-raised);
  color: var(--lp-ink-primary);
  border: 1px solid var(--lp-border-subtle);
  box-shadow: var(--lp-shadow-sm);
  font-size: var(--lp-text-sm);
  font-weight: var(--lp-weight-semibold);
  cursor: pointer;
  align-items: center; justify-content: center;
  z-index: 210;
  transition: transform .15s, border-color .15s;
}
.sidebar-expand-btn:hover { transform: translateX(2px); border-color: var(--lp-accent); }

/* Collapsed-sidebar state (desktop only) */
@media (min-width: 961px) {
  body.sidebar-collapsed .sidebar { transform: translateX(-100%); }
  body.sidebar-collapsed .main-content { margin-left: 0; }
  body.sidebar-collapsed .sidebar-expand-btn { display: flex; }
}

/* Sidebar nav list */
.sidebar-nav {
  flex: 1;
  padding: 8px 8px 6px;
  display: flex; flex-direction: column; gap: 1px;
  overflow-y: auto;
  overscroll-behavior: contain;
}
.sidebar-nav::-webkit-scrollbar { width: 3px; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--lp-border-subtle); border-radius: 4px; }

.sidebar-section-label {
  font-size: var(--lp-text-2xs);
  font-weight: var(--lp-weight-semibold);
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--lp-ink-disabled);
  padding: 14px 10px 5px;
  display: block;
  flex-shrink: 0;
}

/* Sidebar item */
.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 7px;
  font-size: var(--lp-text-sm);
  font-weight: var(--lp-weight-medium);
  color: var(--lp-ink-muted);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  width: 100%;
  text-decoration: none;
  transition: background .12s ease, color .12s ease;
}
.sidebar-item:hover {
  background: var(--lp-surface-sunken);
  color: var(--lp-ink-primary);
}
/* Unified active signal: accent blue — same as tabs and pills */
.sidebar-item.active {
  background: var(--lp-accent-bg);
  color: var(--lp-accent-ink);
  font-weight: var(--lp-weight-semibold);
}
.si-icon {
  font-size: var(--lp-text-base);
  flex-shrink: 0;
  width: 20px;
  text-align: center;
  line-height: 1;
  opacity: 0.75;
}
.sidebar-item.active .si-icon { opacity: 1; }
.sidebar-item:hover .si-icon { opacity: 0.9; }
.si-label { flex: 1; }
.si-chevron {
  font-size: var(--lp-text-2xs);
  color: var(--lp-ink-disabled);
  flex-shrink: 0;
  transition: transform .18s ease;
}
.sidebar-group-btn.open .si-chevron,
.sidebar-group.open .sidebar-group-btn .si-chevron {
  transform: rotate(180deg);
  color: var(--lp-ink-muted);
}
.sidebar-group-btn.open,
.sidebar-group.open .sidebar-group-btn {
  color: var(--lp-ink-primary);
  background: var(--lp-surface-sunken);
}

/* Sub-menu — collapsible */
.sidebar-group { display: block; }
.sidebar-submenu {
  display: none;
  flex-direction: column;
  gap: 1px;
  margin: 1px 0 3px 6px;
  padding-left: 14px;
  border-left: 1.5px solid var(--lp-border-subtle);
}
.sidebar-group.open .sidebar-submenu { display: flex; }
.sidebar-subitem {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: var(--lp-text-xs);
  font-weight: var(--lp-weight-medium);
  color: var(--lp-ink-muted);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  text-align: left;
  width: 100%;
  text-decoration: none;
  transition: background .12s, color .12s;
}
.sidebar-subitem:hover {
  background: var(--lp-surface-sunken);
  color: var(--lp-ink-primary);
}
.sidebar-subitem.active {
  background: var(--lp-accent-bg);
  color: var(--lp-accent-ink);
  font-weight: var(--lp-weight-semibold);
}
.sidebar-subitem .si-icon { font-size: var(--lp-text-sm); width: 16px; }

/* Sidebar footer */
.sidebar-footer {
  padding: 12px 16px 14px;
  flex-shrink: 0;
  border-top: 1px solid var(--lp-border-subtle);
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.sidebar-stat {
  font-size: var(--lp-text-2xs);
  color: var(--lp-ink-disabled);
  line-height: var(--lp-leading-relaxed);
  font-weight: var(--lp-weight-regular);
}
.sidebar-stat strong { color: var(--lp-ink-muted); font-weight: var(--lp-weight-semibold); }

/* ── Main content ────────────────────────────────────────────────── */
.main-content {
  margin-left: var(--lp-sidebar-w);
  flex: 1;
  min-width: 0;
  background: var(--lp-surface-canvas);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  transition: margin-left .25s cubic-bezier(0.22,1,0.36,1);
}

/* ── Page header — flat, no glass ────────────────────────────────── */
.page-hdr {
  padding: 18px var(--lp-page-pad) 14px;
  background: var(--lp-surface-raised);
  border-bottom: 1px solid var(--lp-border-subtle);
  flex-shrink: 0;
}
/* Back / breadcrumb link */
.page-hdr-back {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--lp-text-xs);
  font-weight: var(--lp-weight-medium);
  color: var(--lp-ink-muted);
  text-decoration: none;
  margin-bottom: 8px;
  padding: 3px 0;
  transition: color var(--lp-duration) ease-out;
}
.page-hdr-back:hover { color: var(--lp-ink-primary); }
.page-hdr-back::before { content: "←"; font-size: var(--lp-text-sm); }
.page-hdr-title {
  font-size: var(--lp-text-xl);
  font-weight: var(--lp-weight-semibold);
  color: var(--lp-ink-primary);
  letter-spacing: -0.4px;
  line-height: var(--lp-leading-tight);
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-hdr-sub {
  font-size: var(--lp-text-sm);
  color: var(--lp-ink-muted);
  margin-top: 3px;
  font-weight: var(--lp-weight-regular);
}

/* ── Mobile: hamburger + overlay ─────────────────────────────────── */
.sidebar-toggle {
  display: none;
  position: fixed; top: 12px; left: 12px; z-index: 300;
  background: var(--lp-brand-primary);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 9px 12px;
  font-size: var(--lp-text-base);
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(15,23,42,0.2);
  line-height: 1;
  transition: opacity .15s;
}
.sidebar-toggle:active { opacity: 0.85; }
.sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.35);
  z-index: 199;
  opacity: 0;
  transition: opacity .2s;
}
.sidebar-overlay.open { display: block; opacity: 1; }

@media (max-width: 960px) {
  .sidebar {
    transform: translateX(-100%);
    width: 260px;
    box-shadow: 4px 0 24px rgba(15,23,42,0.12);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: flex; align-items: center; justify-content: center; }
  .sidebar-collapse-btn { display: none; }
  .sidebar-expand-btn { display: none !important; }
  .main-content { margin-left: 0; }
  .page-hdr { padding: 56px 20px 14px; }
  .page-hdr-title { font-size: var(--lp-text-lg); }
}
@media (max-width: 600px) {
  body { font-size: var(--lp-text-base); }
  .page-hdr { padding: 54px 14px 12px; }
  .page-hdr-title { font-size: var(--lp-text-md); }
  .page-hdr-sub { font-size: var(--lp-text-xs); }
}

/* league-tables: --primary deliberately overridden to a deeper blue
   (was #1e40af). Pass 2 will reconcile against the token system. */
:root { --primary:#1e40af; }
body { font-family:var(--lp-font-sans); background:var(--bg); color:var(--text); margin:0; padding:0; height:100vh; overflow:hidden; }
.page-hdr { padding:26px 36px 12px; border-bottom:1px solid var(--border); background:var(--card); }
.page-hdr-title { font-size:var(--lp-text-xl); font-weight:var(--lp-weight-semibold); letter-spacing:-.3px; margin:0; line-height:var(--lp-leading-tight); }
.page-hdr-sub { font-size:var(--lp-text-sm); color:var(--text-muted); margin:4px 0 0; }
.lt-toolbar { padding:14px 36px; border-bottom:1px solid var(--border); background:var(--card); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.lt-toolbar select { padding:10px 14px; border:1px solid var(--border); border-radius:10px; font-size:var(--lp-text-base); min-width:280px; font-family:inherit; background:#fff; color:var(--text); }
.lt-scroll { flex:1; overflow-y:auto; padding:20px 36px 40px; }
.lt-title { font-weight:var(--lp-weight-semibold); font-size:var(--lp-text-md); margin:0 0 14px; display:inline-flex; align-items:center; gap:8px; color:var(--primary); }
.lt-title a { color:var(--primary); text-decoration:none; }
.lt-title .ext { font-size:var(--lp-text-2xs); color:var(--accent); font-weight:var(--lp-weight-semibold); }
.lt-table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--border); border-radius:12px; }
table.lt { width:100%; border-collapse:collapse; font-size:var(--lp-text-sm); min-width:680px; font-variant-numeric:tabular-nums; }
table.lt th, table.lt td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
table.lt th { background:#f1f5f9; font-weight:var(--lp-weight-semibold); color:var(--text-muted); text-transform:uppercase; letter-spacing:.4px; font-size:var(--lp-text-2xs); position:sticky; top:0; }
table.lt td.pts { font-weight:var(--lp-weight-semibold); color:var(--primary); }
table.lt td.w { color:var(--green); font-weight:var(--lp-weight-medium); }
table.lt td.l { color:var(--red); }
table.lt td.num { color:var(--text-muted); font-weight:var(--lp-weight-medium); width:30px; }
table.lt td.club { font-weight:var(--lp-weight-medium); display:flex; align-items:center; gap:8px; min-width:160px; }
/* Zone-badge: shown in legend only (not on rows — only confirmed teams get badges) */
.zone-badge { display:inline-block; font-size:var(--lp-text-2xs); font-weight:var(--lp-weight-semibold); letter-spacing:.3px; padding:2px 6px; border-radius:4px; white-space:nowrap; font-family:var(--lp-font-sans); }
.badge-champ  { background:#fbbf24; color:#78350f; }
.badge-promo  { background:#4ade80; color:#14532d; }
.badge-cl     { background:#3b82f6; color:#fff; }
.badge-el     { background:#f97316; color:#fff; }
.badge-ecl    { background:#8b5cf6; color:#fff; }
.badge-pl     { background:#93c5fd; color:#1e3a8a; }
.badge-rpl    { background:#fdba74; color:#7c2d12; }
.badge-r      { background:#f87171; color:#7f1d1d; }
/* Row colours — distinct per zone so you can read the table at a glance */
.zone-champ      { background:#fefce8; }   /* gold tint  — champions */
.zone-promo      { background:#dcfce7; }   /* green      — auto promotion */
.zone-cl         { background:#dbeafe; }   /* blue       — Champions League */
.zone-el         { background:#ffedd5; }   /* orange     — Europa League */
.zone-ecl        { background:#ede9fe; }   /* purple     — Conference League */
.zone-playoff    { background:#eff6ff; }   /* light blue — promotion playoff */
.zone-rel-playoff { background:#fff7ed; }  /* amber      — relegation playoff */
.zone-rel        { background:#fef2f2; }   /* red        — relegated */
.lt-legend { display:flex; flex-wrap:wrap; gap:10px 20px; margin-top:14px; font-size:var(--lp-text-2xs); color:var(--text-muted); }
.lt-legend-item { display:flex; align-items:center; gap:5px; }
.lt-legend-swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
.lt-empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
.lt-empty .big { font-size:2rem; opacity:.4; margin-bottom:8px; }
.lt-divider { height:2px; background:var(--border); margin:0; opacity:.6; }
/* Play-off tab + bracket */
.lt-tabs { display:flex; gap:4px; }
.lt-tab { padding:9px 14px; border:1px solid var(--border); background:#fff; border-radius:10px; cursor:pointer; font-size:var(--lp-text-sm); font-weight:var(--lp-weight-medium); color:var(--text-muted); font-family:inherit; }
.lt-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.lt-tab:disabled { opacity:.4; cursor:not-allowed; }
/* === Tournament bracket — bold, high-contrast === */
.po-wrap { display:flex; flex-direction:column; gap:30px; }
.po-comp { background:linear-gradient(160deg, #f8fafc 0%, #ffffff 60%); border:1px solid #cbd5e1; border-radius:16px; padding:24px 26px; box-shadow:0 2px 6px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04); }
.po-comp-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px; padding-bottom:14px; border-bottom:2px solid #e2e8f0; }
.po-comp-title { font-weight:var(--lp-weight-semibold); font-size:var(--lp-text-md); margin:0; color:#1e3a8a; letter-spacing:-.2px; }
.po-comp-winner { display:inline-flex; align-items:center; gap:7px; font-size:var(--lp-text-sm); color:#fff; font-weight:var(--lp-weight-semibold); background:linear-gradient(135deg, #16a34a 0%, #15803d 100%); padding:6px 14px; border-radius:999px; border:1px solid #15803d; box-shadow:0 2px 6px rgba(22,163,74,.25); }
.po-comp-winner .crown { font-size:1.1em; }
.po-bracket { display:flex; gap:32px; overflow-x:auto; padding:6px 2px 20px; align-items:stretch; position:relative; }
.po-column { flex:1; min-width:240px; display:flex; flex-direction:column; }
.po-col-head { font-size:var(--lp-text-2xs); font-weight:var(--lp-weight-semibold); color:#fff; background:#1e3a8a; text-transform:uppercase; letter-spacing:1px; margin:0 0 14px; text-align:center; padding:8px 10px; border-radius:8px; box-shadow:0 2px 4px rgba(30,58,138,.2); }
.po-col-head.final { background:linear-gradient(135deg, #d97706 0%, #b45309 100%); box-shadow:0 2px 6px rgba(217,119,6,.3); }
.po-ties { display:flex; flex-direction:column; gap:16px; justify-content:space-around; flex:1; }
.po-tie { background:#fff; border:1px solid #cbd5e1; border-radius:12px; padding:0; overflow:hidden; box-shadow:0 2px 6px rgba(15,23,42,.08); transition:box-shadow .15s, transform .15s, border-color .15s; }
.po-tie:hover { box-shadow:0 6px 18px rgba(15,23,42,.12); transform:translateY(-1px); }
.po-tie.has-winner { border-color:#22c55e; box-shadow:0 2px 8px rgba(34,197,94,.18); }
.po-fixture-row { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:11px 14px; border-bottom:1px solid #e2e8f0; font-size:var(--lp-text-sm); background:#fff; }
.po-fixture-row:last-of-type { border-bottom:none; }
.po-fixture-row.unplayed { background:repeating-linear-gradient(135deg, #f1f5f9 0px, #f1f5f9 6px, #f8fafc 6px, #f8fafc 12px); }
.po-team-name { font-weight:var(--lp-weight-medium); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#1e293b; }
.po-team-name.winner { color:#14532d; font-weight:700; }
.po-team-name.winner::before { content:'\25B6'; color:#16a34a; margin-right:6px; font-size:.7em; }
.po-team-name.loser { color:#94a3b8; text-decoration:line-through; text-decoration-color:#cbd5e1; }
.po-team-score { font-variant-numeric:tabular-nums; font-weight:700; padding:3px 11px; background:#1e3a8a; border:1px solid #1e3a8a; border-radius:6px; min-width:34px; text-align:center; color:#fff; font-size:var(--lp-text-sm); }
.po-team-score.tbd { background:#e2e8f0; border-color:#cbd5e1; color:#64748b; }
.po-team-score.winner { background:linear-gradient(135deg, #16a34a 0%, #15803d 100%); border-color:#15803d; color:#fff; box-shadow:0 1px 3px rgba(22,163,74,.3); }
.po-tie-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 14px; font-size:var(--lp-text-2xs); color:#475569; background:#f1f5f9; border-top:1px solid #cbd5e1; font-weight:var(--lp-weight-medium); }
.po-tie-meta .agg { font-weight:700; color:#1e3a8a; background:#dbeafe; padding:2px 8px; border-radius:4px; border:1px solid #93c5fd; }
.po-tie-meta .sfx { background:#fef3c7; color:#78350f; padding:2px 7px; border-radius:4px; font-weight:700; margin-left:4px; border:1px solid #fcd34d; }
.po-tie-meta .src { background:#ede9fe; color:#5b21b6; padding:2px 7px; border-radius:4px; font-weight:700; margin-left:4px; font-size:.9em; border:1px solid #c4b5fd; }
.po-tie-goals { padding:9px 14px 11px; border-top:1px solid #cbd5e1; background:linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); font-size:var(--lp-text-2xs); }
.po-tie-goals-row { display:flex; gap:6px; align-items:center; margin:3px 0; color:#1e293b; }
.po-tie-goals-row .min { color:#16a34a; width:auto; font-variant-numeric:tabular-nums; font-size:.95em; }
.po-tie-goals-row .scorer { font-weight:var(--lp-weight-medium); }
.po-tie-goals-row .side { font-size:.85em; color:var(--text-muted); margin-left:auto; }
.po-tie-goals-row .tag { font-size:.78em; padding:1px 5px; border-radius:3px; margin-left:4px; font-weight:700; }
.po-tie-goals-row .tag.pen { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
.po-tie-goals-row .tag.own { background:#fde68a; color:#78350f; border:1px solid #fcd34d; }
/* Final column gets a gold accent */
.po-column.final .po-tie { border-color:#fbbf24; box-shadow:0 2px 8px rgba(251,191,36,.25); }
.po-column.final .po-tie.has-winner { border-color:#d97706; box-shadow:0 6px 20px rgba(217,119,6,.3); }
.po-column.final .po-tie .po-team-score:not(.tbd):not(.winner) { background:#d97706; border-color:#b45309; }
/* Connector lines between columns */
.po-column + .po-column { position:relative; }
.po-column + .po-column::before {
  content:''; position:absolute; left:-32px; top:50%; width:32px; height:2px;
  background:linear-gradient(90deg, transparent 0%, #94a3b8 25%, #1e3a8a 100%);
  border-radius:2px;
}
.po-column.final + .po-column::before, .po-column + .po-column.final::before {
  background:linear-gradient(90deg, transparent 0%, #fbbf24 25%, #d97706 100%);
}
.po-empty { text-align:center; padding:40px 20px; color:var(--text-muted); font-size:var(--lp-text-sm); }
.po-data-stale { font-size:var(--lp-text-2xs); color:var(--text-muted); font-style:italic; margin-top:6px; }
@media (max-width:900px) {
  .po-bracket { flex-direction:column; gap:18px; }
  .po-column + .po-column::before { display:none; }
  .po-column { min-width:0; }
}
/* Confirmation badges */
.conf-badge {
  display:inline-block; margin-left:6px; padding:1px 7px;
  border-radius:999px; font-size:var(--lp-text-2xs); font-weight:700;
  letter-spacing:.3px; vertical-align:middle; white-space:nowrap;
  line-height:1.6;
}
.conf-up  { background:#dcfce7; color:#15803d; }
.conf-rel { background:#fee2e2; color:#b91c1c; }
@media (max-width:960px) { .page-hdr { padding:58px 16px 10px; } .lt-toolbar, .lt-scroll { padding-left:14px; padding-right:14px; } .lt-toolbar select { min-width:100%; } }

/* ── Fixtures view ─────────────────────────────────────────────── */
.fx-nav {
  display:flex; align-items:center; justify-content:center;
  gap:20px; padding:20px 0 24px;
}
.fx-nav-btn {
  background:var(--card); border:1px solid var(--border);
  border-radius:var(--lp-radius-ctrl); padding:8px 24px;
  font-size:26px; line-height:1; cursor:pointer; color:var(--text);
  transition:background var(--lp-duration);
}
.fx-nav-btn:hover:not(:disabled) { background:var(--lp-surface-sunken); }
.fx-nav-btn:disabled { opacity:.3; cursor:not-allowed; }
.fx-nav-label {
  font-size:var(--lp-text-md); font-weight:var(--lp-weight-semibold);
  color:var(--text); min-width:200px; text-align:center;
}
.fx-list {
  display:flex; flex-direction:column; gap:24px;
  max-width:900px; margin:0 auto; width:100%;
}
.fx-date-label {
  font-size:var(--lp-text-sm); font-weight:var(--lp-weight-semibold);
  color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px;
  padding-bottom:8px; border-bottom:1px solid var(--border); margin-bottom:0;
}
.fx-row {
  display:flex; align-items:center; gap:12px;
  padding:14px 20px;
  background:var(--card); border-bottom:1px solid var(--lp-border-soft);
}
.fx-row:first-of-type { border-radius:var(--lp-radius-ctrl) var(--lp-radius-ctrl) 0 0; }
.fx-row:last-of-type  { border-radius:0 0 var(--lp-radius-ctrl) var(--lp-radius-ctrl); border-bottom:none; }
.fx-row:only-of-type  { border-radius:var(--lp-radius-ctrl); border-bottom:none; }
.fx-crest {
  width:30px; height:30px; object-fit:contain; flex-shrink:0;
}
.fx-crest-placeholder { width:30px; flex-shrink:0; }
.fx-team {
  flex:1; font-size:var(--lp-text-base); font-weight:var(--lp-weight-medium);
  color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.fx-team.home { text-align:right; }
.fx-team.away { text-align:left; }
.fx-pos { font-size:var(--lp-text-xs); color:var(--text-muted); font-weight:normal; margin-left:4px; }
.fx-score {
  display:flex; align-items:center; gap:4px;
  min-width:64px; justify-content:center; flex-shrink:0;
}
.fx-goal {
  font-size:var(--lp-text-md); font-weight:var(--lp-weight-semibold);
  color:var(--text-muted); min-width:20px; text-align:center;
  font-variant-numeric:tabular-nums;
}
.fx-goal.winner { color:var(--text); }
.fx-sep { color:var(--lp-ink-disabled); font-size:var(--lp-text-base); }
.fx-vs {
  font-size:var(--lp-text-sm); color:var(--text-muted);
  min-width:64px; text-align:center; flex-shrink:0;
  font-weight:var(--lp-weight-medium);
}
.fx-empty { padding:48px 0; text-align:center; color:var(--text-muted); font-size:var(--lp-text-sm); }
</style>
</head>

<script>
/* ── Shared Sidebar JS — included on every page ───────────────── */

function toggleSidebar() {
  var s = document.getElementById('sidebar');
  var o = document.getElementById('sidebarOverlay');
  if (s) s.classList.toggle('open');
  if (o) o.classList.toggle('open');
}
function closeSidebar() {
  var s = document.getElementById('sidebar');
  var o = document.getElementById('sidebarOverlay');
  if (s) s.classList.remove('open');
  if (o) o.classList.remove('open');
}

// Expand / collapse a sidebar group (Positions, Summer 2026)
function toggleSidebarGroup(groupKey, btn) {
  var group = document.querySelector('.sidebar-group[data-group="' + groupKey + '"]');
  if (!group) return;
  var open = group.classList.toggle('open');
  if (btn) btn.classList.toggle('open', open);
  try {
    var state = JSON.parse(localStorage.getItem('lp_sb_groups') || '{}');
    state[groupKey] = open;
    localStorage.setItem('lp_sb_groups', JSON.stringify(state));
  } catch (e) {}
}

// Collapse / expand the entire desktop sidebar (slides it off-screen)
function toggleSidebarCollapse() {
  var collapsed = document.body.classList.toggle('sidebar-collapsed');
  try { localStorage.setItem('lp_sb_collapsed', collapsed ? '1' : '0'); } catch (e) {}
}

// ── On load: restore collapse state, auto-open group for active subitem, highlight active item ──
(function initSidebar() {
  // Restore collapse state
  try {
    if (localStorage.getItem('lp_sb_collapsed') === '1') {
      document.body.classList.add('sidebar-collapsed');
    }
  } catch (e) {}

  function applyActive() {
    var path = location.pathname.split('/').pop() || 'index.html';
    var hash = (location.hash.match(/#tab=(\w+)/) || [])[1] || '';
    // Clear all active classes on href-based items
    document.querySelectorAll('.sidebar-item[href], .sidebar-subitem[href]').forEach(function(el) {
      el.classList.remove('active');
    });
    // Clear group-btn active state — we'll reapply
    document.querySelectorAll('.sidebar-group').forEach(function(g) { g.classList.remove('active-child'); });

    document.querySelectorAll('.sidebar-item[href], .sidebar-subitem[href]').forEach(function(el) {
      var href = el.getAttribute('href') || '';
      var hFile = href.split('#')[0].split('/').pop();
      var hHash = (href.match(/#tab=(\w+)/) || [])[1] || '';
      var matches = (hFile === path) && (hHash === hash);
      // Master-database.html with no hash → League Directory (tab=directory)
      if (!matches && hFile === path && !hHash) {
        matches = !hash || hash === 'directory';
      }
      if (matches) {
        el.classList.add('active');
        // If the active element is inside a group, open the group
        var group = el.closest('.sidebar-group');
        if (group) {
          group.classList.add('open', 'active-child');
          var btn = group.querySelector('.sidebar-group-btn');
          if (btn) btn.classList.add('open');
        }
      }
    });

    // Restore any manually-expanded groups from localStorage (unless already opened above)
    try {
      var state = JSON.parse(localStorage.getItem('lp_sb_groups') || '{}');
      Object.keys(state).forEach(function(k) {
        if (state[k]) {
          var g = document.querySelector('.sidebar-group[data-group="' + k + '"]');
          if (g) {
            g.classList.add('open');
            var b = g.querySelector('.sidebar-group-btn');
            if (b) b.classList.add('open');
          }
        }
      });
    } catch (e) {}
  }

  applyActive();

  // Re-apply on hash change (tab links from other pages)
  window.addEventListener('hashchange', function() {
    applyActive();
    if (typeof switchTab === 'function') {
      var h = (location.hash.match(/#tab=(\w+)/) || [])[1];
      if (h) switchTab(h);
    }
  });
})();

<script>
(function() {
  var LT      = JSON.parse(document.getElementById('data-tables').textContent);
  var LT2526  = JSON.parse(document.getElementById('data-tables-2526').textContent);
  var META    = JSON.parse(document.getElementById('data-tables-meta').textContent);
  var URL = JSON.parse(document.getElementById('data-table-urls').textContent);
  var CL  = JSON.parse(document.getElementById('data-country-leagues').textContent);
  var PO  = JSON.parse(document.getElementById('data-playoffs').textContent);
  var FX  = JSON.parse(document.getElementById('data-fixtures').textContent);
  var CM  = JSON.parse(document.getElementById('crest-manifest').textContent);
  var sel = document.getElementById('ltLeague');
  var body = document.getElementById('ltBody');
  var tabTable    = document.getElementById('tabTable');
  var tabFixtures = document.getElementById('tabFixtures');
  var tabPlayoffs = document.getElementById('tabPlayoffs');
  var tabSeason2526 = document.getElementById('tabSeason2526');
  var tabSeason2627 = document.getElementById('tabSeason2627');
  var currentView = 'table';
  var currentSeason = '2627';
  function currentLT() { return currentSeason === '2526' ? LT2526 : LT; }
  var fxMatchdayIdx = {}; // per-league selected matchday index
  function esc(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  // Normalise club name for fuzzy matching: lowercase, strip common suffixes
  function _normClub(s) {
    return (s || '').toLowerCase()
      .replace(/\s+(f\.?c\.?|a\.?f\.?c\.?|s\.?c\.?|b\.?c\.?|fk|sk|rsc|bv|sv|vfb|vfl|ac|as|rc|cd|ud|sd|rcd)$/i, '')
      .trim();
  }
  // Pre-build normalised crest lookup: normName -> url
  var _normCrestMap = {};
  Object.keys(CM).forEach(function(k) { _normCrestMap[_normClub(k)] = CM[k]; });

  function _crestUrl(teamName) {
    if (!teamName) return null;
    var norm = _normClub(teamName);
    if (_normCrestMap[norm]) return _normCrestMap[norm];
    // Partial match: find manifest key that starts with or contains norm
    var keys = Object.keys(_normCrestMap);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].indexOf(norm) === 0 || (norm.length >= 5 && keys[i].indexOf(norm) !== -1)) return _normCrestMap[keys[i]];
    }
    return null;
  }

  // Build position lookup for a league: normName -> 1-indexed position
  function _buildPosMap(league) {
    var rows = currentLT()[league] || [];
    var map = {};
    rows.forEach(function(r, i) { map[_normClub(r.club)] = i + 1; });
    return map;
  }

  function _lookupPos(posMap, teamName) {
    if (!teamName || !posMap) return null;
    var norm = _normClub(teamName);
    if (posMap[norm] !== undefined) return posMap[norm];
    // Partial: find posMap key that starts with norm or norm starts with key
    var keys = Object.keys(posMap);
    for (var i = 0; i < keys.length; i++) {
      if (keys[i].indexOf(norm) === 0 || norm.indexOf(keys[i]) === 0) return posMap[keys[i]];
    }
    return null;
  }

  var avail = [];
  function populateLeagues() {
    var D = currentLT();
    avail = Object.keys(D).filter(function(l) { return D[l] && D[l].length; });
    var prev = sel.value;
    sel.innerHTML = '';
    Object.keys(CL).forEach(function(country) {
      var leagues = CL[country].filter(function(l) { return avail.indexOf(l) !== -1; });
      if (!leagues.length) return;
      var og = document.createElement('optgroup');
      og.label = country;
      leagues.forEach(function(lg) {
        var o = document.createElement('option');
        o.value = lg; o.textContent = lg;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
    // Restore previous selection if still available
    if (prev) {
      for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].value === prev) { sel.selectedIndex = i; break; }
      }
    }
  }
  populateLeagues();

  // Per-league zone rules: positions are 1-indexed.
  // Each entry: { champ:N, promo:[from,to], euro:[from,to], playoff:[from,to], relPlayoff:[pos], rel:[from,to] }
  // Absent keys = not applicable. rel is always measured from bottom (negative = from end).
  // Zone rules — positions 1-indexed.
  // cl/el/ecl are separate so each gets its own row colour.
  // rel[0] < 0 means count from bottom (e.g. -3 = last 3 rows).
  var ZONES = {
    // English pyramid
    'Premier League':         { champ:1, cl:[1,5], el:[6,6], ecl:[7,7], rel:[-3,0] },
    'Championship':           { champ:1, promo:[1,2],  playoff:[3,6],   rel:[-3,0] },
    'League One':             { champ:1, promo:[1,2],  playoff:[3,6],   rel:[-4,0] },
    'League Two':             { champ:1, promo:[1,3],  playoff:[4,7],   rel:[-2,0] },
    'National League':        { champ:1, promo:[1,1],  playoff:[2,7],   rel:[-3,0] },
    'National League North':  { champ:1, promo:[1,1],  playoff:[2,7],   rel:[-1,0] },
    'National League South':  { champ:1, promo:[1,1],  playoff:[2,7],   rel:[-1,0] },
    // Scotland
    'Scottish Premiership':   { champ:1, cl:[1,1], el:[2,2], ecl:[3,3], relPlayoff:-2, rel:[-1,0] },
    'Scottish Championship':  { champ:1, promo:[1,1],  playoff:[2,4],   rel:[-1,0] },
    // Ireland
    'League of Ireland':      { champ:1, cl:[1,1], el:[2,2], rel:[-2,0] },
    // Spain
    'LaLiga':                 { champ:1, cl:[1,4], el:[5,5], ecl:[6,7], rel:[-3,0] },
    'LaLiga II':              { champ:1, promo:[1,2],  playoff:[3,6],   rel:[-4,0] },
    // Germany
    'Bundesliga':             { champ:1, cl:[1,4], el:[5,5], ecl:[6,6], relPlayoff:-3, rel:[-2,0] },
    '2. Bundesliga':          { champ:1, promo:[1,2],  playoff:[3,3],   rel:[-2,0] },
    // Italy
    'Serie A':                { champ:1, cl:[1,4], el:[5,6], ecl:[7,7], rel:[-3,0] },
    'Serie B':                { champ:1, promo:[1,2],  playoff:[3,8],   rel:[-3,0] },
    // France
    'Ligue 1':                { champ:1, cl:[1,2], el:[3,4], ecl:[5,6], relPlayoff:-3, rel:[-2,0] },
    'Ligue 2':                { champ:1, promo:[1,2],  playoff:[3,5],   rel:[-3,0] },
    // Netherlands
    'Eredivisie':             { champ:1, cl:[1,1], el:[2,3], ecl:[4,5], playoff:[6,8], relPlayoff:-2, rel:[-1,0] },
    'Eerste Divisie':         { champ:1, promo:[1,1],  playoff:[2,8] },
    // Belgium
    'Belgian Pro League':     { champ:1, cl:[1,1], el:[2,2], ecl:[3,4], rel:[-2,0] },
    // Portugal
    'Liga Portugal':          { champ:1, cl:[1,2], el:[3,3], ecl:[4,4], rel:[-3,0] },
    'Liga Portugal 2':        { champ:1, promo:[1,2],  playoff:[3,6],   rel:[-3,0] },
    // Others
    'Danish Superliga':       { champ:1, cl:[1,1], el:[2,2], rel:[-2,0] },
    'Allsvenskan':            { champ:1, rel:[-2,0] },
    'Eliteserien':            { champ:1, rel:[-2,0] },
    'Superettan':             { champ:1, promo:[1,2],  playoff:[3,3],   rel:[-2,0] },
    'OBOS-ligaen':            { champ:1, promo:[1,1],  playoff:[2,6],   rel:[-2,0] },
    'Danish 1. Division':     { champ:1, promo:[1,2],  rel:[-2,0] },
    'Besta deild karla':      { champ:1, rel:[-2,0] },
    'Lengjudeild karla':      { champ:1, promo:[1,2],  rel:[-2,0] },
    'Austrian Bundesliga':    { champ:1, cl:[1,1], el:[2,2], rel:[-3,0] },
    'Swiss Super League':     { champ:1, cl:[1,1], el:[2,2], rel:[-2,0] },
    'Saudi Pro League':       { champ:1, rel:[-3,0] },
    'UAE Pro League':         { champ:1, rel:[-3,0] },
  };

  function getZone(league, pos1, total) {
    var z = ZONES[league];
    if (!z) {
      if (pos1 === 1)       return { type:'champ', badge:'Champ', badgeCls:'badge-champ', label:'Champions',         cls:'zone-champ' };
      if (pos1 <= 4)        return { type:'cl',    badge:'CL',    badgeCls:'badge-cl',    label:'Champions League',  cls:'zone-cl'    };
      if (pos1 > total - 3) return { type:'rel',   badge:'R',     badgeCls:'badge-r',     label:'Relegated',         cls:'zone-rel'   };
      return null;
    }
    if (z.champ && pos1 === z.champ)
      return { type:'champ', badge:'Champ', badgeCls:'badge-champ', label:'Champions', cls:'zone-champ' };
    if (z.cl && pos1 >= z.cl[0] && pos1 <= z.cl[1])
      return { type:'cl',      badge:'CL',    badgeCls:'badge-cl',    label:'Champions League',    cls:'zone-cl'      };
    if (z.el && pos1 >= z.el[0] && pos1 <= z.el[1])
      return { type:'el',      badge:'EL',    badgeCls:'badge-el',    label:'Europa League',       cls:'zone-el'      };
    if (z.ecl && pos1 >= z.ecl[0] && pos1 <= z.ecl[1])
      return { type:'ecl',     badge:'ECL',   badgeCls:'badge-ecl',   label:'Conference League',   cls:'zone-ecl'     };
    if (z.promo && pos1 >= z.promo[0] && pos1 <= z.promo[1])
      return { type:'promo',   badge:'Pr',    badgeCls:'badge-promo', label:'Promoted',            cls:'zone-promo'   };
    if (z.playoff && pos1 >= z.playoff[0] && pos1 <= z.playoff[1])
      return { type:'playoff', badge:'Pl',    badgeCls:'badge-pl',    label:'Promotion playoff',   cls:'zone-playoff' };
    var rpPos = z.relPlayoff ? (z.relPlayoff < 0 ? total + z.relPlayoff + 1 : z.relPlayoff) : null;
    if (rpPos && pos1 === rpPos)
      return { type:'rel-playoff', badge:'R/Pl', badgeCls:'badge-rpl', label:'Relegation playoff', cls:'zone-rel-playoff' };
    if (z.rel && z.rel[0] !== 0) {
      var relFrom = z.rel[0] < 0 ? total + z.rel[0] + 1 : z.rel[0];
      var relTo   = z.rel[1] <= 0 ? total + z.rel[1]     : z.rel[1];
      if (pos1 >= relFrom && pos1 <= relTo)
        return { type:'rel', badge:'R', badgeCls:'badge-r', label:'Relegated', cls:'zone-rel' };
    }
    return null;
  }

  // ── Mathematical confirmation ──────────────────────────────────────
  function computeConfirmation(rows, leagueName) {
    var n = rows.length;
    if (n < 2) return;
    var totalGames = (n - 1) * 2;
    rows.forEach(function(r) {
      r._pts = parseInt(r.points) || 0;
      var played = parseInt(r.played) || 0;
      r._mr  = Math.max(0, totalGames - played);
    });
    var z = ZONES[leagueName];
    if (!z) return;

    // Champion confirmed: leader's pts − 2nd's pts > 2nd's max remaining points
    if (rows.length >= 2 && rows[0]._pts - rows[1]._pts > rows[1]._mr * 3) {
      rows[0].confirmed = 'champ';
    }

    // Promotion zone confirmed (automatic promotion slots)
    if (z.promo) {
      var pe = z.promo[1]; // last promo position (1-based)
      if (rows.length > pe) {
        var boundary = rows[pe - 1]._pts - rows[pe]._pts; // gap at boundary
        if (boundary > rows[pe]._mr * 3) {
          for (var i = 0; i < pe; i++) { if (!rows[i].confirmed) rows[i].confirmed = 'promo'; }
        }
      }
    }

    // Playoff zone confirmed
    if (z.playoff) {
      var plEnd = z.playoff[1];
      if (rows.length > plEnd) {
        var plBoundary = rows[plEnd - 1]._pts - rows[plEnd]._pts;
        if (plBoundary > rows[plEnd]._mr * 3) {
          for (var i = z.playoff[0] - 1; i < plEnd; i++) { if (!rows[i].confirmed) rows[i].confirmed = 'playoff'; }
        }
      }
    }

    // Relegation confirmed
    if (z.rel && z.rel[0] !== 0) {
      var relFrom1 = z.rel[0] < 0 ? n + z.rel[0] + 1 : z.rel[0]; // 1-based first relegated pos
      var relTo1   = z.rel[1] <= 0 ? n + z.rel[1]     : z.rel[1];
      var safeIdx  = relFrom1 - 2; // 0-based index of last safe team
      if (safeIdx >= 0 && rows.length >= relTo1) {
        // The first relegated team cannot reach the last safe team's points
        var relFirstPts    = rows[relFrom1 - 1]._pts;
        var relFirstMaxPts = relFirstPts + rows[relFrom1 - 1]._mr * 3;
        if (relFirstMaxPts < rows[safeIdx]._pts) {
          for (var i = relFrom1 - 1; i < relTo1; i++) { rows[i].confirmed = 'rel'; }
        }
      }
    }
  }

  // Build bracket columns: QF -> SF -> Final, ordered left-to-right.
  // Each leg of a two-leg tie is its own column. The 2nd-leg column carries
  // the aggregate / tie-winner info so the visual flow stays correct.
  // If there are only Semi-Finals (no Final yet), a placeholder Final column
  // is appended so the bracket always ends at the Final.
  function bucketRounds(rounds) {
    var cols = (rounds || []).map(function(rnd) {
      return { name: rnd.name, round: rnd };
    });
    var order = ['preliminary','quarter','semi','final'];
    function legRank(n) {
      n = (n || '').toLowerCase();
      if (n.indexOf('1st leg') !== -1) return 0;
      if (n.indexOf('2nd leg') !== -1) return 1;
      return 0;
    }
    cols.sort(function(a, b) {
      function stageRank(n) {
        n = (n || '').toLowerCase();
        for (var i = 0; i < order.length; i++) if (n.indexOf(order[i]) !== -1) return i;
        return order.length;
      }
      var sa = stageRank(a.name), sb = stageRank(b.name);
      if (sa !== sb) return sa - sb;
      return legRank(a.name) - legRank(b.name);
    });
    // Append a placeholder Final column if missing
    var hasFinal = cols.some(function(c) {
      var n = c.name.toLowerCase();
      return n.indexOf('final') !== -1 && n.indexOf('semi') === -1 && n.indexOf('quarter') === -1;
    });
    var hasSemi = cols.some(function(c) { return c.name.toLowerCase().indexOf('semi') !== -1; });
    if (hasSemi && !hasFinal) {
      cols.push({ name: 'Final', round: { name: 'Final', fixtures: [] }, placeholder: true });
    }
    return cols;
  }

  // Build ties for a column. Each round in our new layout is one column,
  // so a tie is just one fixture from that round.
  // For 2nd-leg rounds, we attach the aggregate and tie-winner found via
  // the matching 1st-leg fixture so the 2nd-leg cards show the running agg.
  function buildTies(col, allCols) {
    var rnd = col.round;
    if (!rnd) return [];
    return (rnd.fixtures || []).map(function(fx) {
      var t = { fixtures: [fx], scoreSuffix: fx.score_suffix || '' };
      if ((col.name || '').toLowerCase().indexOf('2nd leg') !== -1) {
        t.aggregate = fx.aggregate;
        t.tieWinner = fx.tie_winner;
      } else if ((col.name || '').toLowerCase().indexOf('1st leg') === -1) {
        // Single-leg round (e.g. Final, QF, NL Semi-Final)
        t.single = true;
      }
      return t;
    });
  }

  // Produce placeholder "TBC vs TBC" cards in the Final column when no final
  // fixture has been published yet, so the bracket has a visible Final node.
  function placeholderTies(prevCol) {
    var prev = prevCol && prevCol.round;
    if (!prev || !prev.fixtures || !prev.fixtures.length) {
      return [{ fixtures: [{ home: 'TBC', away: 'TBC', score: '-:-', played: false, date: '', time: '' }], single: true, placeholder: true }];
    }
    // Pair each two consecutive fixtures into a TBC final-spot card
    return [{ fixtures: [{ home: 'Semi-final winner', away: 'Semi-final winner', score: '-:-', played: false, date: '', time: '' }], single: true, placeholder: true }];
  }

  function renderFixtureRow(fx, tieWinner, isFinalLeg) {
    var parts = (fx.score || '').split(':');
    var h = parseInt(parts[0]); var a = parseInt(parts[1]);
    var hWin = false, aWin = false;
    if (fx.played && !isNaN(h) && !isNaN(a)) {
      hWin = h > a; aWin = a > h;
    }
    // Penalty shootout: if a pen_winner is known, treat them as the winner regardless of the regulation score
    if (fx.pen_winner) {
      hWin = (fx.pen_winner === fx.home);
      aWin = (fx.pen_winner === fx.away);
    }
    // If we have a tieWinner from aggregate, override the single-leg winner indicator
    var hAggWin = tieWinner && tieWinner === fx.home;
    var aAggWin = tieWinner && tieWinner === fx.away;
    var rowCls = 'po-fixture-row' + (fx.played ? '' : ' unplayed');
    var hcls = 'po-team-name' + (hAggWin || (isFinalLeg ? false : hWin) ? ' winner' : (fx.played && aWin ? ' loser' : ''));
    var acls = 'po-team-name' + (aAggWin || (isFinalLeg ? false : aWin) ? ' winner' : (fx.played && hWin ? ' loser' : ''));
    var hScoreCls = 'po-team-score' + (fx.played ? '' : ' tbd') + (hWin ? ' winner' : '');
    var aScoreCls = 'po-team-score' + (fx.played ? '' : ' tbd') + (aWin ? ' winner' : '');
    var hScore = fx.played ? (isNaN(h) ? '-' : h) : '-';
    var aScore = fx.played ? (isNaN(a) ? '-' : a) : '-';
    var html = '';
    html += '<div class="' + rowCls + '"><div class="' + hcls + '">' + esc(fx.home) + '</div><div class="' + hScoreCls + '">' + hScore + '</div></div>';
    html += '<div class="' + rowCls + '"><div class="' + acls + '">' + esc(fx.away) + '</div><div class="' + aScoreCls + '">' + aScore + '</div></div>';
    return html;
  }

  function renderGoals(fx) {
    if (!fx.goals || !fx.goals.length) return '';
    var html = '<div class="po-tie-goals">';
    // Group by side
    var home = fx.goals.filter(function(g) { return g.side === 'home'; });
    var away = fx.goals.filter(function(g) { return g.side === 'away' || !g.side; });
    function block(label, list) {
      if (!list.length) return '';
      var b = '<div class="po-tie-goals-row"><span class="scorer" style="color:var(--text-muted);font-weight:600;">' + esc(label) + '</span></div>';
      list.forEach(function(g) {
        var tag = '';
        if (g.type === 'pen') tag = '<span class="tag pen">PEN</span>';
        else if (g.type === 'own') tag = '<span class="tag own">OG</span>';
        b += '<div class="po-tie-goals-row"><span class="min">&#9917;</span><span class="scorer">' + esc(g.scorer) + '</span>' + tag + '</div>';
      });
      return b;
    }
    html += block(fx.home, home);
    html += block(fx.away, away);
    html += '</div>';
    return html;
  }

  function renderTie(tie, isFinalColumn) {
    var hasWinner = !!tie.tieWinner || (tie.single && tie.fixtures[0] && tie.fixtures[0].played);
    var html = '<div class="po-tie' + (hasWinner ? ' has-winner' : '') + '">';
    tie.fixtures.forEach(function(fx, i) {
      var isFinalLeg = !tie.single && i === tie.fixtures.length - 1;
      html += renderFixtureRow(fx, tie.tieWinner, isFinalLeg);
    });
    // Meta line (date, aggregate)
    var lastFx = tie.fixtures[tie.fixtures.length - 1];
    var metaBits = [];
    if (lastFx && lastFx.date) {
      metaBits.push('<span>' + esc(lastFx.date) + (lastFx.time ? ' &middot; ' + esc(lastFx.time) : '') + '</span>');
    } else {
      metaBits.push('<span></span>');
    }
    if (tie.aggregate) {
      var suffix = tie.scoreSuffix ? ' <span class="sfx">' + esc(tie.scoreSuffix) + '</span>' : '';
      metaBits.push('<span class="agg">agg ' + esc(tie.aggregate) + suffix + '</span>');
    } else if (lastFx && lastFx.score_suffix) {
      metaBits.push('<span class="sfx">' + esc(lastFx.score_suffix) + '</span>');
    }
    var srcSet = {};
    tie.fixtures.forEach(function(fx) { if (fx.score_source) srcSet[fx.score_source] = true; });
    var srcs = Object.keys(srcSet);
    if (srcs.length) {
      metaBits.push('<span class="src" title="Score sourced from ' + esc(srcs.join(', ')) + ' (TM lag)">via ' + esc(srcs.join('+')) + '</span>');
    }
    if (metaBits.length) html += '<div class="po-tie-meta">' + metaBits.join('') + '</div>';
    // Goals (combined across legs)
    tie.fixtures.forEach(function(fx) { html += renderGoals(fx); });
    html += '</div>';
    return html;
  }

  function renderPlayoffs(league) {
    // Skip competitions with no rounds yet (e.g. a play-off that hasn't started).
    var entries = (PO[league] || []).filter(function(e) { return e.rounds && e.rounds.length; });
    if (!entries.length) {
      body.innerHTML = '<div class="po-empty">No play-off data for ' + esc(league) + ' yet.</div>';
      return;
    }
    var html = '<div class="po-wrap">';
    entries.forEach(function(entry) {
      html += '<div class="po-comp">';
      html += '<div class="po-comp-head">';
      html += '<h3 class="po-comp-title">' + esc(entry.competition) + '</h3>';
      if (entry.winner) {
        html += '<div class="po-comp-winner"><span class="crown">&#127942;</span>' + esc(entry.winner) + '</div>';
      }
      html += '</div>';
      var cols = bucketRounds(entry.rounds || []);
      html += '<div class="po-bracket">';
      cols.forEach(function(col, ci) {
        var isFinalColumn = /final/i.test(col.name) && !/semi|quarter/i.test(col.name);
        html += '<div class="po-column' + (isFinalColumn ? ' final' : '') + '">';
        html += '<h4 class="po-col-head' + (isFinalColumn ? ' final' : '') + '">' + esc(col.name) + '</h4>';
        var ties;
        if (col.placeholder) {
          ties = placeholderTies(cols[ci - 1]);
        } else {
          ties = buildTies(col, cols);
        }
        html += '<div class="po-ties">';
        ties.forEach(function(t) { html += renderTie(t, isFinalColumn); });
        html += '</div></div>';
      });
      html += '</div></div>';
    });
    html += '</div>';
    body.innerHTML = html;
  }

  window.setView = function(v) {
    currentView = v;
    try { localStorage.setItem('lt_view', v); } catch(e) {}
    tabTable.classList.toggle('active', v === 'table');
    tabFixtures.classList.toggle('active', v === 'fixtures');
    tabPlayoffs.classList.toggle('active', v === 'playoffs');
    renderLT();
  };

  window.setSeason = function(s) {
    currentSeason = s;
    try { localStorage.setItem('lt_season', s); } catch(e) {}
    tabSeason2526.classList.toggle('active', s === '2526');
    tabSeason2627.classList.toggle('active', s === '2627');
    // Live season has no fixtures/play-off data — force table view
    if (s !== '2526') {
      tabFixtures.disabled = true;
      tabPlayoffs.disabled = true;
      if (currentView !== 'table') { currentView = 'table'; }
      tabTable.classList.add('active');
      tabFixtures.classList.remove('active');
      tabPlayoffs.classList.remove('active');
    }
    populateLeagues();
    onLeagueChange();
  };

  window.onLeagueChange = function() {
    var selected = sel.value;
    try { localStorage.setItem('lt_league', selected); } catch(e) {}
    var isArchive = currentSeason === '2526';
    var hasPlayoffs = isArchive && !!(PO[selected] && PO[selected].some(function(e) { return e.rounds && e.rounds.length; }));
    var hasFixtures = isArchive && !!(FX[selected] && FX[selected].matchdays && FX[selected].matchdays.length);
    tabPlayoffs.disabled = !hasPlayoffs;
    tabFixtures.disabled = !hasFixtures;
    // Sync tab active classes to currentView
    tabTable.classList.toggle('active', currentView === 'table');
    tabFixtures.classList.toggle('active', currentView === 'fixtures');
    tabPlayoffs.classList.toggle('active', currentView === 'playoffs');
    if (!hasPlayoffs && currentView === 'playoffs') { setView('table'); return; }
    if (!hasFixtures && currentView === 'fixtures') { setView('table'); return; }
    renderLT();
  };

  // ── Fixtures renderer ──────────────────────────────────────────────────
  function _fmtDate(s) {
    // Input: "Fri 22/05/26" or "22/05/26" — return a readable label
    if (!s) return 'Date TBC';
    // Try to produce "Friday 22 May 2026" from "Fri 22/05/26"
    var m = s.match(/(\w+)\s+(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (m) {
      var days  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      var day = parseInt(m[2], 10);
      var mon = parseInt(m[3], 10) - 1;
      var yr  = parseInt(m[4], 10);
      if (yr < 100) yr += 2000;
      var monName = months[mon] || m[3];
      return m[1] + ' ' + day + ' ' + monName + ' ' + yr;
    }
    return s;
  }

  window.navigateMatchday = function(delta) {
    var lg = sel.value;
    var fd = FX[lg];
    if (!fd) return;
    var idx = (fxMatchdayIdx[lg] !== undefined ? fxMatchdayIdx[lg] : (fd.current_matchday || 0)) + delta;
    idx = Math.max(0, Math.min(idx, fd.matchdays.length - 1));
    fxMatchdayIdx[lg] = idx;
    try { localStorage.setItem('fx_md_' + lg, idx); } catch(e) {}
    renderFixtures(lg);
  };

  function renderFixtures(league) {
    var fd = FX[league];
    if (!fd || !fd.matchdays || !fd.matchdays.length) {
      body.innerHTML = '<div class="fx-empty">No fixture data for ' + esc(league) + '.</div>';
      return;
    }
    var matchdays = fd.matchdays;
    var idx = fxMatchdayIdx[league] !== undefined ? fxMatchdayIdx[league] : (fd.current_matchday || 0);
    idx = Math.max(0, Math.min(idx, matchdays.length - 1));
    fxMatchdayIdx[league] = idx;

    var md      = matchdays[idx];
    var total   = matchdays.length;
    var posMap  = _buildPosMap(league);
    var logoMap = fd.club_logos || {};

    var html = '<div class="fx-nav">';
    html += '<button class="fx-nav-btn" onclick="navigateMatchday(-1)"'
          + (idx === 0 ? ' disabled' : '') + '>&#8249;</button>';
    html += '<span class="fx-nav-label">' + esc(md.round) + '</span>';
    html += '<button class="fx-nav-btn" onclick="navigateMatchday(1)"'
          + (idx === total - 1 ? ' disabled' : '') + '>&#8250;</button>';
    html += '</div>';

    function _teamHtml(name, side) {
      // Prefer scraped logo from fixture data; fall back to local manifest
      var crest = logoMap[name] || _crestUrl(name);
      var pos   = _lookupPos(posMap, name);
      var posHtml = pos !== null ? '<span class="fx-pos">(' + pos + ')</span>' : '';
      var crestHtml = crest
        ? '<img class="fx-crest" src="' + esc(crest) + '" alt="" onerror="this.remove()">'
        : '<span class="fx-crest-placeholder"></span>';
      // Layout: home = [name+pos][crest]  |score|  [crest][name+pos] = away
      if (side === 'home') {
        return '<span class="fx-team home">' + esc(name) + posHtml + '</span>' + crestHtml;
      } else {
        return crestHtml + '<span class="fx-team away">' + esc(name) + posHtml + '</span>';
      }
    }

    // Group fixtures by date
    var byDate = {};
    var dateOrder = [];
    (md.fixtures || []).forEach(function(fx) {
      var d = fx.date || 'Date TBC';
      if (!byDate[d]) { byDate[d] = []; dateOrder.push(d); }
      byDate[d].push(fx);
    });

    html += '<div class="fx-list">';
    dateOrder.forEach(function(date) {
      html += '<div class="fx-date-group">';
      html += '<div class="fx-date-label">' + esc(_fmtDate(date)) + '</div>';
      byDate[date].forEach(function(fx) {
        var played = fx.played;
        html += '<div class="fx-row">';
        html += _teamHtml(fx.home, 'home');
        if (played && fx.score) {
          var parts = (fx.score || '0:0').split(':');
          var h = parseInt(parts[0], 10);
          var a = parseInt(parts[1], 10);
          var hWin = h > a, aWin = a > h;
          html += '<span class="fx-score">'
            + '<span class="fx-goal' + (hWin ? ' winner' : '') + '">' + h + '</span>'
            + '<span class="fx-sep">:</span>'
            + '<span class="fx-goal' + (aWin ? ' winner' : '') + '">' + a + '</span>'
            + '</span>';
        } else {
          html += '<span class="fx-vs">' + esc(fx.time || 'TBD') + '</span>';
        }
        html += _teamHtml(fx.away, 'away');
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';

    body.innerHTML = html;
  }

  // "Updated <date>" line under the table title, with a stale warning when a
  // league's source has not refreshed in over 10 days (or never did).
  function sourceNote(league) {
    if (currentSeason === '2526') {
      return '<p class="po-data-stale">Final 2025/26 standings (archived).</p>';
    }
    var meta = META[league] || {};
    if (!meta.scraped_at) {
      return '<p class="po-data-stale" style="color:#b45309;">No live source for this league yet — showing the last table we captured.</p>';
    }
    var when = new Date(meta.scraped_at);
    var days = Math.floor((Date.now() - when.getTime()) / 86400000);
    var stamp = when.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
    if (days > 10) {
      return '<p class="po-data-stale" style="color:#b45309;">Last updated ' + esc(stamp) + ' (' + days + ' days ago) — may be out of date.</p>';
    }
    return '<p class="po-data-stale">Updated ' + esc(stamp) + '.</p>';
  }

  window.renderLT = function() {
    var selected = sel.value;
    if (currentView === 'fixtures') {
      renderFixtures(selected);
      return;
    }
    if (currentView === 'playoffs') {
      renderPlayoffs(selected);
      return;
    }
    var rows = currentLT()[selected];
    if (!avail.length) {
      body.innerHTML = '<div class="lt-empty"><div class="big">&#128202;</div><div>No league table data yet.</div></div>';
      return;
    }
    if (!rows || !rows.length) {
      body.innerHTML = '<div class="lt-empty">No table data for ' + esc(selected) + '.</div>';
      return;
    }
    // Deep-copy rows so confirmed flags don't persist across re-renders
    rows = rows.map(function(r) { return Object.assign({}, r); });
    computeConfirmation(rows, selected);
    // Mark the play-off winner as 'Promoted via play-offs' (overrides 'Playoff'
    // confirmation) — 25/26 play-off data, so archive season only.
    var poEntries = currentSeason === '2526' ? (PO[selected] || []) : [];
    poEntries.forEach(function(entry) {
      if (!entry.winner) return;
      rows.forEach(function(r) {
        var club = (r.club || '').toLowerCase();
        var winner = entry.winner.toLowerCase();
        if (club === winner || club.indexOf(winner) !== -1 || winner.indexOf(club) !== -1) {
          r.confirmed = 'promoted_po';
          r.po_competition = entry.competition;
        }
      });
    });
    var meta = META[selected] || {};
    var src  = meta.source || '';
    var link = currentSeason === '2526' ? '' : (meta.url || URL[selected] || '');
    var srcLabel = src === 'wikipedia' ? 'Wikipedia' : (src || 'source');
    var title = link
      ? '<a href="' + esc(link) + '" target="_blank">' + esc(selected) + ' <span class="ext">&#8599; ' + esc(srcLabel) + '</span></a>'
      : esc(selected);
    var html = '<h3 class="lt-title">' + title + '</h3>' + sourceNote(selected);
    html += '<div class="lt-table-wrap"><table class="lt"><thead><tr>'
         + '<th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>';
    var legendZones = {};
    rows.forEach(function(r, i) {
      var pos1  = i + 1;
      var zInfo = getZone(selected, pos1, rows.length);
      // Override: play-off winners get the green 'promoted' tint regardless of league position
      if (r.confirmed === 'promoted_po') {
        zInfo = { type:'promo', badge:'Pr', badgeCls:'badge-promo', label:'Promoted via play-offs', cls:'zone-promo' };
      }
      var zCls  = zInfo ? zInfo.cls : '';
      var zTip  = zInfo ? ' title="' + esc(zInfo.label) + '"' : '';
      if (zInfo && !legendZones[zInfo.type]) legendZones[zInfo.type] = zInfo;
      // Confirmation badge
      var confBadge = '';
      var CONF_LABELS = { champ:'✓ Champions', promo:'✓ Promoted', playoff:'✓ Playoff', rel:'↓ Relegated', promoted_po:'\u2B06 Promoted via play-offs' };
      if (r.confirmed && CONF_LABELS[r.confirmed]) {
        var confCls = r.confirmed === 'rel' ? 'conf-badge conf-rel' : 'conf-badge conf-up';
        var titleAttr = (r.confirmed === 'promoted_po' && r.po_competition) ? ' title="Won the ' + esc(r.po_competition) + '"' : '';
        confBadge = ' <span class="' + confCls + '"' + titleAttr + '>' + CONF_LABELS[r.confirmed] + '</span>';
      }
      html += '<tr class="' + zCls + '"' + zTip + '>'
           +  '<td class="num">' + pos1 + '</td>'
           +  '<td class="club">' + esc(r.club) + confBadge + '</td>'
           +  '<td>' + esc(r.played) + '</td>'
           +  '<td class="w">' + esc(r.won) + '</td>'
           +  '<td>' + esc(r.drawn) + '</td>'
           +  '<td class="l">' + esc(r.lost) + '</td>'
           +  '<td>' + esc(r.gf) + '</td>'
           +  '<td>' + esc(r.ga) + '</td>'
           +  '<td>' + esc(r.gd) + '</td>'
           +  '<td class="pts">' + esc(r.points) + '</td>'
           +  '</tr>';
    });
    html += '</tbody></table></div>';
    // Legend — badges shown here, not on rows
    var legendOrder = ['champ','promo','cl','el','ecl','playoff','rel-playoff','rel'];
    var legendHtml = '<div class="lt-legend">';
    legendOrder.forEach(function(t) {
      if (legendZones[t]) {
        var z = legendZones[t];
        legendHtml += '<div class="lt-legend-item">'
                   +  '<span class="zone-badge ' + z.badgeCls + '">' + esc(z.badge) + '</span>'
                   +  '<span>' + esc(z.label) + '</span></div>';
      }
    });
    legendHtml += '</div>';
    body.innerHTML = html + legendHtml;
  };
  if (sel.options.length) {
    var saved = '';
    try { saved = localStorage.getItem('lt_league') || ''; } catch(e) {}
    var savedIdx = -1;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === saved) { savedIdx = i; break; }
    }
    sel.selectedIndex = savedIdx >= 0 ? savedIdx : 0;
  }
  // Restore saved matchday indices for all leagues
  try {
    Object.keys(FX).forEach(function(lg) {
      var v = localStorage.getItem('fx_md_' + lg);
      if (v !== null) fxMatchdayIdx[lg] = parseInt(v, 10);
    });
  } catch(e) {}
  // Restore view (fixtures/playoffs/table)
  var savedView = '';
  try { savedView = localStorage.getItem('lt_view') || ''; } catch(e) {}
  if (savedView === 'fixtures' || savedView === 'playoffs') {
    currentView = savedView;
  }
  // Restore saved season; default to the live 26/27 season
  var savedSeason = '';
  try { savedSeason = localStorage.getItem('lt_season') || ''; } catch(e) {}
  if (savedSeason === '2526') {
    setSeason('2526');
  } else {
    onLeagueChange();
